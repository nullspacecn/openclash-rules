# Perfect-Rules 家庭路由器 Smart 适配版，2026-10-06
# Smart 自动组使用内置历史权重；当前路由器未安装 LightGBM 模型。
# 保留手动地区选择；不收集训练数据、不强制 ASN 查询。
# 默认首选低倍率 Smart：仅匹配名称标注 0.01x、0.1x 的节点，空组拒绝连接。
# 面板已保存的手动选择可能继续保留；导入后确认默认代理选中低倍率组。
# 原始参考：https://github.com/n0de-sudo/Perfect-Rules/blob/main/Clash/Clash_merge.yaml
# 保留机场节点、订阅、代理端口和现有 Fake-IP 增强模式。
# 路由器看不到 LAN 客户端进程；软件分流改用域名规则。
# 空地区组拒绝连接，避免静默回退直连；可在面板手动改选其他地区。
[General]
CORE_TYPE = Smart
PROXY_MODE = rule
CHINA_IP_ROUTE = 0
CHINA_IP6_ROUTE = 0
IPV6_ENABLE = 0
IPV6_DNS = 0
ENABLE_RESPECT_RULES = 1
RESTART = false

[YAML]
'mode': 'rule'
'dns':
  'nameserver!':
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  'default-nameserver!':
    - '223.5.5.5'
    - '119.29.29.29'
  'proxy-server-nameserver!':
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'
  'respect-rules': true
  'fake-ip-filter+':
    - '*.lan'
    - '*.local'
    - '+.ts.net'
    - '+.tailscale.com'
    - '+.tailscale.io'
  'nameserver-policy':
    'geosite:private':
      - 'system'
    'geosite:cn':
      - 'https://dns.alidns.com/dns-query'
      - 'https://doh.pub/dns-query'
'rule-providers':
